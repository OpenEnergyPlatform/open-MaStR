name: Update MaStR fallback XSD

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-xsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # use a version the project supports

      - name: Install package
        run: pip install -e .

      - name: Update fallback XSD
        run: |
          set +e
          python scripts/update_fallback_xsd.py 2>&1 | tee "$RUNNER_TEMP/update.log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            if grep -q "No difference between current and new XSD" "$RUNNER_TEMP/update.log"; then
              echo "No XSD changes, nothing to do."
              exit 0
            fi
            echo "Script failed with exit code $status" >&2
            exit "$status"
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: develop
          branch: automated/fallback-xsd-update
          commit-message: "chore: update fallback XSD"
          title: "Update fallback XSD"
          body: |
            Automated update of the fallback XSD files from the latest MaStR documentation.
            Generated by `scripts/update_fallback_xsd.py`.
          add-paths: open_mastr/resources/
