name: Pre-commit Checks

on:
  pull_request:
    branches:
      - production
      - develop

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: Run pre-commit hooks

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project and dev dependencies including pre-commit.
          # We use the dev dependencies because the mypy pre-commit hook
          # needs the typing library stubs:
          # https://mypy.readthedocs.io/en/stable/running_mypy.html#library-stubs-not-installed
          pip install -e ".[dev]"

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
