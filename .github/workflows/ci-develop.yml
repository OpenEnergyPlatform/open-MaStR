name: CI - Pytest Develop

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop

concurrency:
  group: ci-pytest-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    name: pytest (Python ${{ matrix.python-version }}) (OS ${{ matrix.os }})

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Create credentials file
      env:
        MASTR_TOKEN: ${{ secrets.MASTR_TOKEN }}
        MASTR_USER: ${{ secrets.MASTR_USER }}
      run: |
        python -c "from tests import preparation; preparation.create_credentials_file()"
    - name: Stagger start
      shell: bash
      run: sleep $(( ${{ strategy.job-index }} * 5 ))
    - name: Test with pytest
      run: pytest -vv
