# Global excludes - apply to all hooks
# open_mastr/resources/ holds the vendored BNetza fallback XSD files. They are
# regenerated verbatim by scripts/update_fallback_xsd.py, so no hook may rewrite them.
exclude: ^(build/|dist/|.*\.egg-info/|\.tox/|\.pytest_cache/|\.mypy_cache/|__pycache__/|postprocessing/|open_mastr/soap_api/|scripts/|open_mastr/resources/)

repos:
  # Base pre-commit hooks for common issues
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.ipynb$
      - id: end-of-file-fixer
        exclude: \.ipynb$
      - id: check-yaml
        # --unsafe: syntax-only check. mkdocs.yml uses the MkDocs Material tag
        # !!python/name:material.extensions.emoji.twemoji, which safe-load rejects.
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict
      - id: check-docstring-first
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Ruff - fast, comprehensive linter and formatter (replaces flake8, isort, pylint, pyupgrade, black, pydocstyle)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy - static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-tqdm
          - types-python-dateutil
        args: [--ignore-missing-imports, --show-error-codes]
        exclude: ^(tests/|scripts/|docs/|postprocessing/)
